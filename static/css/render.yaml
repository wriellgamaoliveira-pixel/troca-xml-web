services:
  - type: web
    name: troca-xml-web
    env: python
    region: ohio  # ou sua região preferida
    plan: free  # ou starter, pro, etc
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1