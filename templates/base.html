<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Troca XML{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <a href="{{ url_for('index') }}" class="nav-logo">
          <i data-lucide="file-text"></i> Troca XML
        </a>
        <div class="nav-links">
          <a class="nav-link {% if request.path=='/' %}active{% endif %}" href="{{ url_for('index') }}"><i data-lucide="home" class="nav-icon"></i> Início</a>
          <a class="nav-link {% if request.path.startswith('/nota') %}active{% endif %}" href="{{ url_for('nota_page') }}"><i data-lucide="file-search" class="nav-icon"></i> Nota Única</a>
          <a class="nav-link {% if request.path.startswith('/resumo') %}active{% endif %}" href="{{ url_for('resumo_page') }}"><i data-lucide="bar-chart-3" class="nav-icon"></i> Resumo</a>
          <a class="nav-link {% if request.path.startswith('/alteracao-lote') %}active{% endif %}" href="{{ url_for('alteracao_lote_page') }}"><i data-lucide="database" class="nav-icon"></i> Alteração em Lote</a>
        </div>
      </div>

      <span class="badge"><i data-lucide="circle-dot"></i> Sem sessão</span>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
