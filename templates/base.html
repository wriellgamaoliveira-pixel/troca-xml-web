<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Troca XML{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <a href="{{ url_for('index') }}" class="nav-logo">
          <i data-lucide="file-text"></i> Troca XML
        </a>
        <div class="nav-links">
          <a class="nav-link {% if request.path=='/' %}active{% endif %}" href="{{ url_for('index') }}"><i data-lucide="home" class="nav-icon"></i> Início</a>
          <a class="nav-link {% if request.path.startswith('/nota') %}active{% endif %}" href="{{ url_for('nota_page') }}"><i data-lucide="file-search" class="nav-icon"></i> Nota Única</a>
          <a class="nav-link {% if request.path.startswith('/resumo-cclass') or request.path.startswith('/resumo/resultado') or request.path=='/resumo' %}active{% endif %}" href="{{ url_for('resumo_cclass_page') }}"><i data-lucide="bar-chart-3" class="nav-icon"></i> Relatório por cClass</a>
          <a class="nav-link {% if request.path.startswith('/resumo-imposto') %}active{% endif %}" href="{{ url_for('resumo_imposto_page') }}"><i data-lucide="receipt-text" class="nav-icon"></i> Relatório por Imposto</a>
          <a class="nav-link {% if request.path.startswith('/alteracao-lote') %}active{% endif %}" href="{{ url_for('alteracao_lote_page') }}"><i data-lucide="database" class="nav-icon"></i> Alteração em Lote</a>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;">
        <label for="moduloSelector" class="kpi-label" style="margin:0;white-space:nowrap;">Módulo:</label>
        <select name="modulo" id="moduloSelector" class="select" style="min-width:120px;">
          <option value="nfcom" {% if (modulo or session.get('modulo','nfcom')) == 'nfcom' %}selected{% endif %}>NFCom</option>
          <option value="nfe" {% if (modulo or session.get('modulo','nfcom')) == 'nfe' %}selected{% endif %}>NFe</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    window.__APP_MODULO__ = "{{ (modulo or session.get('modulo', 'nfcom'))|lower }}";
    window.appendModuloToFormData = function(fd){
      const sel = document.getElementById("moduloSelector");
      const m = ((sel && sel.value) || window.__APP_MODULO__ || "nfcom").toLowerCase();
      fd.append("modulo", (m === "nfe" ? "nfe" : "nfcom"));
      return fd;
    };
    document.addEventListener("DOMContentLoaded", () => {
      const sel = document.getElementById("moduloSelector");
      if(!sel) return;
      sel.addEventListener("change", async () => {
        const fd = new FormData();
        window.appendModuloToFormData(fd);
        try {
          const r = await fetch('/api/modulo', {method:'POST', body: fd});
          const j = await r.json().catch(()=>({}));
          if(r.ok && j.success){
            window.__APP_MODULO__ = j.modulo || sel.value;
          }
        } catch(_) {}
      });
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
