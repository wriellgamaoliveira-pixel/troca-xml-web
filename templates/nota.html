{% extends "base.html" %}
{% block title %}Nota Única{% endblock %}

{% block content %}
<div class="card">
  <h1 class="text-2xl font-bold mb-4">Nota Única</h1>
  <p class="text-muted mb-6">Envie um XML (NFe ou NFCom) para visualizar dados básicos.</p>

  <form id="notaForm" class="space-y-4">
    <div>
      <label class="text-sm font-medium mb-2" style="display:block;">Arquivo XML</label>
      <input type="file" name="xml_nota" id="xmlNota" accept=".xml" class="input-field" required />
    </div>
    <button type="submit" class="btn">
      <i data-lucide="search"></i> Visualizar
    </button>
  </form>
</div>

<div class="card hidden" id="notaResult">
  <h2 class="text-xl font-bold mb-4">Resultado</h2>
  <pre id="notaJson" style="white-space:pre-wrap; background:#0b1220; color:#fff; padding:14px; border-radius:10px; overflow:auto;"></pre>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form = document.getElementById('notaForm');
  const result = document.getElementById('notaResult');
  const pre = document.getElementById('notaJson');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const f = document.getElementById('xmlNota').files[0];
    if (!f) return alert('Selecione um XML.');

    const fd = new FormData();
    fd.append('xml_nota', f);

    const r = await fetch('/api/nota/visualizar', { method: 'POST', body: fd });
    const j = await r.json();

    if (!j.success) {
      alert(j.error || 'Erro ao processar');
      return;
    }

    pre.textContent = JSON.stringify(j.data, null, 2);
    result.classList.remove('hidden');
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });
</script>
{% endblock %}
