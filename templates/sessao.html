{% extends "base.html" %}
{% block title %}Sessão - Troca XML{% endblock %}

{% block content %}
<h1 class="page-title">Sessão</h1>
<p class="page-subtitle">Crie uma sessão temporária e acompanhe o status.</p>

<div class="card">
  <div class="card-content">
    <div class="controls">
      <div class="controls-left">
        <button class="btn" id="btnCriar"><i data-lucide="plus"></i> Criar Sessão</button>
        <button class="btn btn-outline" id="btnStatus"><i data-lucide="refresh-cw"></i> Atualizar</button>
      </div>
      <div class="controls-right">
        <span class="pill"><b>Session:</b>&nbsp;<span id="sid">—</span></span>
        <span class="pill"><b>Status:</b>&nbsp;<span id="st">—</span></span>
        <span class="pill"><b>TTL:</b>&nbsp;<span id="ttl">—</span></span>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
  const sidEl = document.getElementById('sid');
  const stEl = document.getElementById('st');
  const ttlEl = document.getElementById('ttl');

  async function refreshStatus(){
    const sid = sidEl.textContent.trim();
    if(!sid || sid==='—') return;
    const r = await fetch(`/api/sessao/status?session_id=${encodeURIComponent(sid)}`);
    const j = await r.json();
    if(j.success){
      stEl.textContent = j.status;
      ttlEl.textContent = `${j.ttl_restante}s`;
    }
  }

  document.getElementById('btnCriar').addEventListener('click', async ()=>{
    const r = await fetch('/api/sessao/criar', {method:'POST'});
    const j = await r.json();
    if(!j.success){ alert(j.error || 'Erro'); return; }
    sidEl.textContent = j.session_id;
    stEl.textContent = 'ativa';
    ttlEl.textContent = `${j.ttl}s`;
  });

  document.getElementById('btnStatus').addEventListener('click', refreshStatus);
</script>
{% endblock %}
