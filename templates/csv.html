{% extends "base.html" %}
{% block title %}CSV{% endblock %}

{% block content %}
<div class="card">
  <h1 class="text-2xl font-bold mb-4">CSV</h1>
  <p class="text-muted mb-6">Envie um ZIP com XMLs e gere um CSV simples.</p>

  <form id="csvForm" class="space-y-4">
    <div>
      <label class="text-sm font-medium mb-2" style="display:block;">Arquivo ZIP</label>
      <input type="file" name="zip_xmls" id="zipCsv" accept=".zip" class="input-field" required />
    </div>

    <div>
      <label class="text-sm font-medium mb-2" style="display:block;">Campos (opcional, separados por “;”)</label>
      <input type="text" id="campos" class="input-field" placeholder="arquivo;tipo;nNF;serie;cNF;dhEmi;emitente_nome;dest_nome;total_vProd" />
      <p class="text-sm text-muted mt-1">Se vazio, exporta um conjunto padrão.</p>
    </div>

    <button type="submit" class="btn">
      <i data-lucide="file-down"></i> Gerar CSV
    </button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('csvForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = document.getElementById('zipCsv').files[0];
    if (!f) return alert('Selecione um ZIP.');

    const fd = new FormData();
    fd.append('zip_xmls', f);
    fd.append('campos', document.getElementById('campos').value || '');

    const r = await fetch('/api/csv/gerar', { method: 'POST', body: fd });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      return alert(j.error || 'Erro ao gerar CSV');
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
</script>
{% endblock %}
