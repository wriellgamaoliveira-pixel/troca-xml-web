{% extends "base.html" %}
{% block title %}CSV - Troca XML{% endblock %}

{% block content %}
<h1 class="page-title">CSV</h1>
<p class="page-subtitle">Envie um ZIP com XMLs e gere um CSV simples.</p>

<div class="card">
  <div class="card-content" style="display:grid;gap:12px;max-width:720px;">
    <form id="csvForm" style="display:grid;gap:12px;">
      <input class="input" type="file" id="zipCsv" name="zip_xmls" accept=".zip" required>

      <input class="input" type="text" id="campos" placeholder="Campos (opcional, separados por ;). Ex: arquivo;tipo;nNF;dhEmi;emitente_nome">

      <button class="btn" type="submit"><i data-lucide="file-down"></i> Gerar CSV</button>
    </form>
    <div class="note">Se “Campos” estiver vazio, exporta um conjunto padrão.</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('csvForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = document.getElementById('zipCsv').files[0];
    if(!f) return alert('Selecione um ZIP.');

    const fd = new FormData();
    fd.append('zip_xmls', f);
    fd.append('campos', document.getElementById('campos').value || '');

    const r = await fetch('/api/csv/gerar', {method:'POST', body: fd});
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      return alert(j.error || 'Erro ao gerar CSV');
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
</script>
{% endblock %}
