{% extends "base.html" %}
{% block title %}Lote - Troca XML{% endblock %}

{% block content %}
<h1 class="page-title">Lote</h1>
<p class="page-subtitle">Envie um ZIP com XMLs, aplique regras e baixe o ZIP processado.</p>

<div class="card">
  <div class="card-content">
    <form id="loteForm" style="display:grid;gap:12px;max-width:720px;">
      <input class="input" type="file" id="zipLote" name="zip_xmls" accept=".zip" required>

      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <label class="pill"><input type="checkbox" id="removerDesconto">&nbsp;Remover desconto</label>
        <label class="pill"><input type="checkbox" id="removerOutros">&nbsp;Remover outros</label>
      </div>

      <textarea class="input" id="regrasTexto" rows="6" placeholder="Regras (uma por linha): cClass;CFOP"></textarea>

      <button class="btn" type="submit"><i data-lucide="wand-2"></i> Processar</button>
    </form>

    <div id="loteOut" class="note" style="display:none;">
      <a class="btn btn-outline" id="btnDownload" href="#"><i data-lucide="download"></i> Baixar ZIP</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form = document.getElementById('loteForm');
  const out = document.getElementById('loteOut');
  const btn = document.getElementById('btnDownload');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = document.getElementById('zipLote').files[0];
    if(!f) return alert('Selecione um ZIP.');

    const fd = new FormData();
    fd.append('zip_xmls', f);
    fd.append('remover_desconto', document.getElementById('removerDesconto').checked ? 'true':'false');
    fd.append('remover_outros', document.getElementById('removerOutros').checked ? 'true':'false');
    fd.append('regras_cclass_cfop', document.getElementById('regrasTexto').value || '');

    const r = await fetch('/api/lote/processar', {method:'POST', body: fd});
    const j = await r.json();
    if(!j.success){ alert(j.error || 'Erro'); return; }

    btn.href = j.download_url;
    out.style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });
</script>
{% endblock %}
